<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Contenedor cuadrado con esquinas suavemente redondeadas rx="22" color plano #2C474E -->
  <rect width="100" height="100" rx="22" fill="#2C474E" />
  
  <!-- Letra 'Y' geométrica en trazo limpio blanco #FFFFFF -->
  <path d="M26 26 L50 51 L74 26 M50 51 L50 76" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Pequeño bloque de barra contable en #86EFAC en la base derecha -->
